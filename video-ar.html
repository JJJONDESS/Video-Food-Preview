<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Video AR</title>
<style>
  /* FIX: Background MUST be transparent to see the camera! */
  html, body { 
    margin: 0; height: 100%; 
    background: transparent !important; 
    color: #fff; font-family: system-ui, sans-serif; 
    overflow: hidden; touch-action: none; 
  }
  
  /* The start screen needs its own background color */
  #startScreen { 
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; text-align: center; padding: 24px; 
    background: #1c1410; /* Solid only on this screen */
  }
  
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 28px; margin: 6px; background: #e8452c; color: #fff; cursor: pointer; }
  button:disabled { background: #555; }
  
  /* AR UI */
  #arUI { display: none; position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #hud { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
  #hud button { background: rgba(0,0,0,0.7); border: 1px solid #fff; font-size: 0.9rem; padding: 10px 20px; }
  #hint { position: fixed; top: 20px; left: 0; right: 0; text-align: center; color: #fff; text-shadow: 0 1px 4px #000; font-weight: bold; }
  #errorBox { color: #ff6b6b; font-size: 0.9rem; margin-top: 20px; font-weight: bold; max-width: 300px; word-wrap: break-word; }
  
  .a-enter-vr, .a-enter-ar { display: none !important; }
</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="startScreen">
  <h1>Video AR Test</h1>
  <p>Point your camera at the target image.</p>
  <button id="startBtn" disabled>Loading Engine...</button>
  <div id="errorBox"></div>
</div>

<div id="arUI">
  <div id="hint">Point at the target image</div>
  <div id="hud">
    <button id="detachBtn">Detach Video</button>
    <button id="exitBtn" style="background: #c0392b;">Exit</button>
  </div>
</div>

<a-scene id="scene" mindar-image="imageTargetSrc: dishes/mcart-targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;" 
         color-space="sRGB" vr-mode-ui="enabled: false">
  
  <a-assets>
    <!-- USING PUBLIC GOOGLE VIDEO FOR TESTING. Swap back to your webm later! -->
    <video id="arVideo" src="dishes/Burgeranimitedvideo.webm" preload="auto" loop="true" muted="true" playsinline crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="videoWrapper">
      <!-- Width 4, Height 3 -->
      <a-video src="#arVideo" width="4" height="3" position="0 0 0"></a-video>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const startScreen = document.getElementById('startScreen');
  const arUI = document.getElementById('arUI');
  const startBtn = document.getElementById('startBtn');
  const errorBox = document.getElementById('errorBox');
  const scene = document.getElementById('scene');
  const videoEl = document.getElementById('arVideo');

  scene.addEventListener('renderstart', () => {
    startBtn.disabled = false;
    startBtn.textContent = "Start Camera";
  });

  startBtn.onclick = async () => {
    startBtn.textContent = "Starting...";
    errorBox.textContent = "";
    
    try {
      const system = scene.systems['mindar-image-system'];
      if (!system) throw new Error("MindAR system not loaded.");
      
      await system.start(); 
      
      // Hide the start screen so the transparent background reveals the camera
      startScreen.style.display = 'none';
      arUI.style.display = 'block';
      
    } catch (error) {
      console.error(error);
      errorBox.textContent = "Camera Error: " + (error.message || error.name || error);
      startBtn.textContent = "Try Again";
    }
  };

  const target = document.getElementById('target');
  target.addEventListener('targetFound', () => {
    document.getElementById('hint').textContent = "Drag to move video";
    videoEl.play().catch(e => console.log("Video play blocked:", e));
  });

  target.addEventListener('targetLost', () => {
    document.getElementById('hint').textContent = "Point at the target image";
    videoEl.pause(); 
  });

  let isDetached = false;
  let isFound = false;
  target.addEventListener('targetFound', () => isFound = true);
  target.addEventListener('targetLost', () => isFound = false);

  document.getElementById('detachBtn').onclick = () => {
    const wrapper = document.getElementById('videoWrapper');
    const camera = document.querySelector('a-camera');
    
    if (!isDetached) {
      if (!isFound) { alert("Point at the marker first!"); return; }
      camera.object3D.attach(wrapper.object3D);
      isDetached = true;
      document.getElementById('detachBtn').textContent = "Attach Back";
    } else {
      target.object3D.add(wrapper.object3D);
      wrapper.object3D.position.set(0, 0, 0);
      wrapper.object3D.rotation.set(0, 0, 0);
      wrapper.object3D.scale.set(1, 1, 1);
      isDetached = false;
      document.getElementById('detachBtn').textContent = "Detach Video";
    }
  };

  document.getElementById('exitBtn').onclick = () => location.reload();
</script>
</body>
</html>
