<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Video AR</title>
<style>
  html, body { 
    margin: 0; height: 100%; background: transparent !important; 
    color: #fff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; 
  }
  #startScreen { 
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; text-align: center; padding: 24px; 
    background: #1c1410; 
  }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 28px; margin: 6px; background: #e8452c; color: #fff; cursor: pointer; }
  button:disabled { background: #555; }
  #arUI { display: none; position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #hud { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
  #hud button { background: rgba(0,0,0,0.7); border: 1px solid #fff; font-size: 0.9rem; padding: 10px 20px; }
  #hint { position: fixed; top: 20px; left: 0; right: 0; text-align: center; color: #fff; text-shadow: 0 1px 4px #000; font-weight: bold; }
  #errorBox { color: #ff6b6b; font-size: 0.9rem; margin-top: 20px; font-weight: bold; max-width: 300px; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  
  /* Hide the video element in the background */
  #arVideo { display: none; }
</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
  // Custom Shader to remove the black background
  AFRAME.registerShader('chromakey', {
    schema: {
      src: { type: 'map' },
      similarity: { type: 'number', default: 0.25 }
    },
    init: function (data) {
      // Create a VideoTexture specifically for the shader
      const texture = new THREE.VideoTexture(document.getElementById('arVideo'));
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      this.material = new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: texture },
          uSimilarity: { value: data.similarity }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uSimilarity;
          varying vec2 vUv;
          void main() {
            vec4 texColor = texture2D(uMap, vUv);
            float brightness = (texColor.r + texColor.g + texColor.b) / 3.0;
            
            // Delete the black background
            if (brightness < uSimilarity) {
              discard;
            }
            gl_FragColor = texColor;
          }
        `,
        transparent: true,
        side: THREE.DoubleSide
      });
    }
  });
</script>
</head>
<body>

<!-- Video placed outside of A-Frame assets so it doesn't block loading -->
<video id="arVideo" src="dishes/Burger_animited_video.webm" loop muted playsinline crossorigin="anonymous"></video>

<div id="startScreen">
  <h1>Video AR Test</h1>
  <p>Point your camera at the target image.</p>
  <button id="startBtn" disabled>Loading Engine...</button>
  <div id="errorBox"></div>
</div>

<div id="arUI">
  <div id="hint">Point at the target image</div>
  <div id="hud">
    <button id="detachBtn">Detach Video</button>
    <button id="exitBtn" style="background: #c0392b;">Exit</button>
  </div>
</div>

<a-scene id="scene" mindar-image="imageTargetSrc: dishes/VegPizza.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.01;" 
         color-space="sRGB" vr-mode-ui="enabled: false">
  
  <!-- Notice: No <a-assets> block anymore! -->

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="videoWrapper">
      <!-- Using the custom shader -->
      <a-entity 
        geometry="primitive: plane; width: 2; height: 1.5" 
        material="shader: chromakey; similarity: 0.3;">
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const scene = document.getElementById('scene');
  const startScreen = document.getElementById('startScreen');
  const arUI = document.getElementById('arUI');
  const startBtn = document.getElementById('startBtn');
  const errorBox = document.getElementById('errorBox');
  const videoEl = document.getElementById('arVideo');
  const target = document.getElementById('target');
  const videoWrapper = document.getElementById('videoWrapper');
  const camera = document.querySelector('a-camera');

  // FIXED: Use 'loaded' instead of 'renderstart' so it doesn't wait for video download
  scene.addEventListener('loaded', () => {
    startBtn.disabled = false;
    startBtn.textContent = "Start Camera";
  });

  startBtn.onclick = async () => {
    startBtn.textContent = "Starting...";
    errorBox.textContent = "";
    
    // Play the video immediately on click (bypasses browser autoplay block)
    videoEl.play().catch(e => console.log("Autoplay error:", e));

    try {
      const system = scene.systems['mindar-image-system'];
      await system.start(); 
      startScreen.style.display = 'none';
      arUI.style.display = 'block';
    } catch (error) {
      errorBox.textContent = "Camera Error: " + (error.message || error.name || error);
      startBtn.textContent = "Try Again";
    }
  };

  let isDetached = false;
  let isFound = false;
  let zv = 1; 

  target.addEventListener('targetFound', () => {
    isFound = true;
    if (!isDetached) document.getElementById('hint').textContent = "Drag to move video";
    videoEl.play().catch(e => console.log(e));
  });

  target.addEventListener('targetLost', () => {
    isFound = false;
    if (!isDetached) {
      document.getElementById('hint').textContent = "Point at the target image";
      videoEl.pause(); 
    }
  });

  document.getElementById('detachBtn').onclick = () => {
    if (!isDetached) {
      if (!isFound) { alert("Point at the marker first!"); return; }
      
      camera.object3D.attach(videoWrapper.object3D);
      
      // Fixed position and scale
      videoWrapper.object3D.position.set(0, 0, -1.5); 
      videoWrapper.object3D.rotation.set(0, 0, 0);
      videoWrapper.object3D.scale.set(1, 1, 1); 
      
      isDetached = true;
      document.getElementById('detachBtn').textContent = "Attach Back";
      document.getElementById('hint').textContent = "Drag to move · Pinch to zoom";
    } else {
      target.object3D.add(videoWrapper.object3D);
      videoWrapper.object3D.position.set(0, 0, 0);
      videoWrapper.object3D.rotation.set(0, 0, 0);
      videoWrapper.object3D.scale.set(1, 1, 1);
      
      isDetached = false;
      zv = 1;
      document.getElementById('detachBtn').textContent = "Detach Video";
      document.getElementById('hint').textContent = "Point at the target image";
    }
  };

  document.getElementById('exitBtn').onclick = () => location.reload();

  const pts = new Map(); 
  let lastD = 0;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };

  window.addEventListener('pointerdown', e => {
    if (!isDetached || e.target.closest('button')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) lastD = dist();
  });

  window.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); 
    if (!p) return;
    
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (pts.size === 1) {
      const o = videoWrapper.object3D.position;
      const f = scene.camera.projectionMatrix.elements[5];
      const k = f ? (2 * (Math.abs(o.z) || 1)) / (f * window.innerHeight) : 0.002;
      o.x += dx * k; 
      o.y -= dy * k;
      if (o.z > -0.5) o.z = -0.5; 
    } else if (pts.size === 2) {
      const d = dist();
      const ratio = (lastD && d) ? d / lastD : 1;
      const nz = Math.min(5, Math.max(0.2, zv * ratio)); 
      zv = nz; 
      lastD = d;
      videoWrapper.object3D.scale.set(zv, zv, zv);
    }
  });

  ['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, e => pts.delete(e.pointerId)));
</script>
</body>
</html>
